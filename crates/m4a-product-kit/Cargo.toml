[package]
name = "m4a-product-kit"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
readme = "README.md"
keywords = ["matrix","messenger","product-server","sqlcipher"]
categories = ["network-programming"]
description = "Building blocks of a product server in front of the messenger server: nick rules, user store trait and service, sessions, tiers, optional login doors, the signing link to the edge and the lifecycle event publisher."

[features]
default = ["sqlite-outbox"]
# Durable event queue in SQLite (survives restarts); without it only the in-memory queue exists.
sqlite-outbox = ["dep:tesserax-store"]
# Real optional login door: a person proves a federated Matrix address by an OpenID token.
matrix-address-door = []

[dependencies]
# Storage engine (published crate): SQLCipher via `cipher-native`, one writer, WAL, batched writes.
tesserax-store = { version = "0.1.1", features = ["cipher-native"], optional = true }
m4a-seam = { workspace = true  }
axum = { version = "0.8", features = ["json", "ws"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
