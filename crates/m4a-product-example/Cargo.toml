[package]
name = "m4a-product-example"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
readme = "README.md"
keywords = ["matrix","messenger","product-server","example"]
categories = ["network-programming"]
description = "A complete, minimal product server on m4a-product-kit: its own SQLite users, register/login/nick/logout, optional login doors, and the signing proxy to the messenger edge. Meant to be run as is or replaced piece by piece by a real product."

[lib]
name = "m4a_product_example"
path = "src/lib.rs"

[[bin]]
name = "m4a-product-example"
path = "src/main.rs"

[features]
default = ["matrix-address-door"]
# The optional Matrix-address login door (enabled at runtime by M4A_PRODUCT_LOGIN_MATRIX=1).
matrix-address-door = ["m4a-product-kit/matrix-address-door"]

[dependencies]
m4a-product-kit = { workspace = true  }
m4a-seam = { workspace = true  }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tesserax-store = { version = "0.1.1", features = ["cipher-native"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
mail4agent-server = { workspace = true  }
m4a-edge = { workspace = true  }
tokio-tungstenite = "0.29"
futures-util = "0.3"
mail4agent-messenger-shell = { workspace = true  }
m4a-agent = { workspace = true, features = ["full"] }
mail4agent-messenger = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
