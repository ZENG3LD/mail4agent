[package]
name = "mail4agent-core"
version = "0.1.0"
edition = "2021"
description = "The mail4agent mailbox engine: participants, addressing, delivery, threading, acknowledgement and persistence."
license = "MIT"

[dependencies]
mail4agent-api = { path = "../mail4agent-api", version = "0.1.0" }

rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
