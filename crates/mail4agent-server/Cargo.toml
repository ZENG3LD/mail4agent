[package]
name = "mail4agent-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Matrix-subset homeserver: protocol decisions plus the Client-Server HTTP routes. No product accounts, logins or tariffs: a product adds its own control plane through the neutral account-source seam and policy hook. Optional self-registration (on by default, switchable off) gives a session its device bearer once."

[lib]
name = "mail4agent_server"
path = "src/lib.rs"

[features]
default = []
# Turns `PRAGMA key` into real SQLCipher. Off by default so a workspace
# build of the mailbox daemon does not link OpenSSL. The builder enables
# this on the binary that opens `init_messenger_db`.
sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Reference Matrix-address login door (OpenID userinfo). Login doors are product layer; off by default.
matrix-openid-door = []

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["std"] }
tracing = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
