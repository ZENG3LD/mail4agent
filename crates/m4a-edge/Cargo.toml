[package]
name = "m4a-edge"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
readme = "README.md"
keywords = ["matrix","messenger","proxy","edge"]
categories = ["network-programming"]
description = "Edge role of the mail4agent messenger: terminates client connections behind a TLS proxy, keeps only light rebuildable state, forwards to the core over a private tunnel."

[lib]
name = "m4a_edge"
path = "src/lib.rs"

[[bin]]
name = "m4a-edge"
path = "src/main.rs"

[dependencies]
m4a-seam = { workspace = true  }
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde_json = "1"

[dev-dependencies]
mail4agent-server = { workspace = true  }
rusqlite = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
