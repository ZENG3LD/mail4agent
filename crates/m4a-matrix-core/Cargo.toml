[package]
name = "m4a-matrix-core"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
keywords = ["matrix","federation","state-resolution","signatures"]
categories = ["network-programming"]
description = "Matrix event layer (hash-id rooms, room version 11): reference-hash event ids, content hashes, signed PDUs, auth checks and state resolution over ruma crates. No HTTP, no SQL."

# The ruma crates move fast and break often: pin exactly, upgrade on purpose.
[dependencies]
ruma-common = { version = "=0.20.0", features = ["client", "server"] }
ruma-events = "=0.35.0"
ruma-signatures = "=0.22.0"
ruma-state-res = "=0.18.0"
js_int = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
ruma-common = { version = "=0.20.0", features = ["client", "server"] }
ruma-events = "=0.35.0"
ruma-signatures = "=0.22.0"
serde_json = "1"
