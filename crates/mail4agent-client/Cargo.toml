[package]
name = "mail4agent-client"
version = "0.1.0"
edition = "2021"
description = "HTTP client for a mail4agent mailbox."
license = "MIT"

[dependencies]
mail4agent-api = { path = "../mail4agent-api", version = "0.1.0" }

reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
