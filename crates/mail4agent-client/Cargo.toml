[package]
name = "mail4agent-client"
version = "0.1.2"
edition = "2021"
description = "HTTP client for a mail4agent mailbox."
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
keywords = ["agent", "mailbox", "http", "client"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
mail4agent-api = { path = "../mail4agent-api", version = "0.1.2" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
