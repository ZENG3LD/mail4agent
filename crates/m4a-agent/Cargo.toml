[package]
name = "m4a-agent"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
description = "The agent-side client of the messenger: one session = one identity = one nick = one credential set, resolved by the client (keys generated and kept in a vault, login by signature). Tiers behind cargo features."

[features]
# The full pack is the default; a light build turns features off.
default = ["full"]
full = ["tier-server", "tier-matrix", "engine", "vault-keychain", "vault-backup", "bridges"]
# The engine driver: runs the sans-I/O messenger core against a backend (HTTP execution, sync worker,
# push socket). Needs a tier to talk to.
engine = ["dep:mail4agent-messenger", "dep:tungstenite", "dep:reqwest"]
# Tier 2: our server through its own (non-Matrix) product API.
tier-server = ["dep:reqwest"]
# Tier 3: the Matrix client API (custom login type, same key proof).
tier-matrix = ["dep:reqwest"]
# The bridge framework (trait, registry, per-room consent, scoped credentials). A bridge itself is
# one more feature, `bridge-<name>`; `bridge-loopback` is the in-memory reference skeleton and is
# not part of `full`.
bridges = []
bridge-loopback = ["bridges"]
# Encrypted export and import of the whole vault under a passphrase (argon2id + AES-256-GCM).
vault-backup = ["dep:argon2"]
# Keep the vault's master key in the OS keychain when there is one.
vault-keychain = ["dep:keyring"]

[dependencies]
m4a-seam = { workspace = true }
mail4agent-messenger = { workspace = true, optional = true }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["std", "rand_core", "zeroize"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
argon2 = { version = "0.5", optional = true }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
