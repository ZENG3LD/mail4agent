[package]
name = "mail4agent-server-bin"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
readme = "README.md"
keywords = ["matrix","messenger","homeserver","process"]
categories = ["network-programming"]
description = "Loopback process for the mail4agent messenger homeserver. Listens on 127.0.0.1 only."

[[bin]]
name = "mail4agent-server-bin"
path = "src/main.rs"

[features]
# Closed rooms are DAG rooms (hash ids, signed events). On by default; turn off for legacy-id-only.
default = ["f3-hash-ids", "presence", "media-federation", "media-thumbnails"]
media-thumbnails = ["mail4agent-server/media-thumbnails"]
presence = ["mail4agent-server/presence"]
media-federation = ["mail4agent-server/media-federation"]
f3-hash-ids = ["mail4agent-server/f3-hash-ids"]

[dependencies]
mail4agent-server = { workspace = true  }
# Names the connection type init_messenger_db returns. Features stay on
# mail4agent-server's sqlcipher flag; this dependency does not add its own.
rusqlite = "0.32"
tesserax-store = { version = "0.1.1", features = ["cipher-native"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
mail4agent-server = { workspace = true  }
m4a-seam = { workspace = true  }
mail4agent-messenger-shell = { workspace = true  }
serde_json = "1"
m4a-product-example = { workspace = true  }
m4a-product-kit = { workspace = true  }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
