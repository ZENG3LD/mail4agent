[package]
name = "mail4agent-messenger-shell"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/mail4agent"
readme = "README.md"
keywords = ["matrix","messenger","client","agent"]
categories = ["network-programming"]
description = "Client shell that opens the sealed messenger store for one session."

[features]
default = ["full"]
full = ["tier-server", "tier-matrix", "vault-keychain", "vault-backup", "element-open", "local-bus", "wake-grok", "wake-claude", "wake-codex", "wake-kimi", "wake-cursor", "wake-routine", "wake-spawn"]
# Wake providers. A provider whose feature is off is not compiled (codex, kimi, claude channel,
# spawn) or refuses to wake with a named reason (grok, cursor, routine); see provider.rs.
wake-grok = ["dep:mail4agent-grok"]
wake-claude = []
wake-codex = []
wake-kimi = []
wake-cursor = []
wake-routine = []
wake-spawn = []
# The OS keychain for the vault master key (a headless machine falls back to an owner-only key file).
vault-keychain = ["m4a-agent/vault-keychain"]
# Encrypted vault backup and restore (`m4a-agent vault backup|restore`).
vault-backup = ["m4a-agent/vault-backup"]
# `m4a-agent element-open`: log in to an Element Web by key signature, nothing printed or stored.
element-open = ["tier-server"]
tier-server = ["m4a-agent/tier-server"]
tier-matrix = ["m4a-agent/tier-matrix"]
# The in-process homeserver that lets bots on one machine reach each other without a network.
# It is the only thing that links the whole server crate.
local-bus = ["dep:mail4agent-server"]

[dependencies]
m4a-seam = { workspace = true }
m4a-agent = { workspace = true, features = ["engine"] }
mail4agent-messenger = { workspace = true  }
mail4agent-server = { workspace = true, optional = true }
mail4agent-grok = { workspace = true, optional = true }
sha2 = "0.10"
zeroize = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Blocking client: the shell is synchronous, same as the engine it drives.
# rustls so https routine posts do not depend on the process CA store.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8" }
# Blocking socket the machine client opens. http homeservers use ws.
# https homeservers use wss, with the webpki roots already used for routines.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rusqlite = "0.32"

[[bin]]
name = "m4a-agent"
path = "src/bin/m4a_agent.rs"

[[bin]]
name = "m4a-ensure-agent-webhooks"
path = "src/bin/ensure_agent_webhooks.rs"

[[bin]]
name = "m4a-web-client"
path = "src/bin/web_client.rs"

[[bin]]
name = "m4a-node-client"
path = "src/bin/node_client.rs"
required-features = ["wake-grok"]

[[bin]]
name = "m4a-grok-listen"
path = "src/bin/grok_listen.rs"
required-features = ["wake-grok"]

[[bin]]
name = "m4a-claude-channel"
path = "src/bin/claude_channel.rs"
required-features = ["wake-claude"]

[[bin]]
name = "m4a-inbox"
path = "src/bin/inbox.rs"

[[bin]]
name = "m4a"
path = "src/bin/m4a.rs"

[[bin]]
name = "m4a-send"
path = "src/bin/send.rs"

[dev-dependencies]
tempfile = "3"
